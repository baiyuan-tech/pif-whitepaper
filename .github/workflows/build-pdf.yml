name: Build Whitepaper PDF

# Aligned with sibling project baiyuan-tech/geo-whitepaper: fonts injected via
# -V CLI flags (not header-includes) to avoid pandoc markdown-escaping of
# fontspec [options]. lang: zh-Hant-TW in metadata to bypass ctexhook.

on:
  push:
    branches: [master]
    paths:
      - "zh-TW/**"
      - "en/**"
      - "assets/pdf/**"
      - ".github/workflows/build-pdf.yml"
  pull_request:
    paths:
      - "zh-TW/**"
      - "en/**"
      - "assets/pdf/**"
      - ".github/workflows/build-pdf.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deposit_tag:
        description: "把這個已發佈 release 的 PDF 存進 Zenodo(例 v0.5.0;留空 = 只建 PDF 不存放)"
        required: false
        default: ""
      diagnose:
        description: "true = 只讀診斷 Zenodo token / 草稿 / newversion,不上傳不發佈"
        required: false
        default: "false"

permissions:
  contents: write   # required for release asset upload

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        lang: [zh-TW, en]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install XeLaTeX + CJK fonts + Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-chinese texlive-fonts-recommended \
            texlive-latex-extra texlive-latex-recommended \
            lmodern \
            fonts-noto-cjk fonts-noto-cjk-extra \
            fonts-noto-color-emoji pandoc librsvg2-bin python3
          sudo fc-cache -fv > /dev/null

      - name: Verify CJK font + xeCJK + lmodern presence (hard assert)
        run: |
          pandoc --version | head -2
          xelatex --version | head -1
          fc-list :lang=zh-tw | grep -qi noto || { echo "FATAL: no Noto CJK zh-tw" >&2; exit 1; }
          kpsewhich xeCJK.sty > /dev/null || { echo "FATAL: xeCJK.sty missing" >&2; exit 1; }
          kpsewhich lmodern.sty > /dev/null || { echo "FATAL: lmodern.sty missing" >&2; exit 1; }
          echo "Prerequisites OK."

      - name: Stamp version into PDF header
        # 頁首版本原本寫死在 assets/pdf/metadata-*.yaml,自 v0.1 起從沒更新過 ——
        # v0.2 / v0.3 / v0.4 的 PDF 頁首全印著 "v0.1 · 2026-04"。
        # 改由 CITATION.cff 推導:那是發版時本來就必須更新的 SSOT
        # (見 CLAUDE.md「引用 / 版本」),不再需要有人記得多改一個地方。
        run: |
          set -eo pipefail
          VER=$(grep -m1 '^version:' CITATION.cff | cut -d'"' -f2)
          REL=$(grep -m1 '^date-released:' CITATION.cff | cut -d'"' -f2)
          if [ -z "$VER" ] || [ -z "$REL" ]; then
            echo "FATAL: 無法從 CITATION.cff 取得 version / date-released" >&2
            exit 1
          fi
          STAMP="v${VER} · ${REL%-*}"
          META="assets/pdf/metadata-${{ matrix.lang }}.yaml"
          python3 - "$META" "$STAMP" "$REL" <<'PY'
          import sys
          path, stamp, rel = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(path, encoding='utf-8') as fh:
              lines = fh.read().split(chr(10))
          MARK = 'fancyhead[R]{'
          n1 = n2 = 0
          out = []
          for line in lines:
              if MARK in line:
                  head, _, rest = line.partition(MARK)
                  tail = rest.split('}', 1)[1] if '}' in rest else ''
                  line = head + MARK + stamp + '}' + tail
                  n1 += 1
              elif line.startswith('date: '):
                  line = 'date: "' + rel + '"'
                  n2 += 1
              out.append(line)
          if n1 != 1 or n2 != 1:
              sys.exit('FATAL: header/date anchors matched %d/%d, expected 1/1' % (n1, n2))
          with open(path, 'w', encoding='utf-8') as fh:
              fh.write(chr(10).join(out))
          print('[stamp] %s -> %s / %s' % (path, stamp, rel))
          PY
          grep -nE 'fancyhead\[R\]|^date:' "$META"

      - name: Concatenate chapters
        run: |
          chmod +x assets/pdf/concat.sh
          bash assets/pdf/concat.sh ${{ matrix.lang }} > whitepaper-${{ matrix.lang }}.md
          wc -l whitepaper-${{ matrix.lang }}.md

      - name: Preprocess for XeLaTeX compatibility
        # Mermaid blocks → placeholder text (diagrams stay rendered on GitHub web).
        # Emoji stripped (CJK fonts don't cover them; decorative only).
        # Variation selectors and ZWJ removed (confuse fontspec).
        run: |
          python3 <<PY
          import re
          lang = "${{ matrix.lang }}"
          p = f"whitepaper-{lang}.md"
          text = open(p, 'r', encoding='utf-8').read()

          text = re.sub(
            r'\`\`\`mermaid\s*\n.*?\n\`\`\`',
            '*[Mermaid diagram — see web version on GitHub]*',
            text, flags=re.DOTALL,
          )

          emoji_ranges = (
            (0x1F300, 0x1F64F), (0x1F680, 0x1F6FF), (0x1F700, 0x1F77F),
            (0x1F780, 0x1F7FF), (0x1F800, 0x1F8FF), (0x1F900, 0x1F9FF),
            (0x1FA00, 0x1FA6F), (0x1FA70, 0x1FAFF), (0x2600, 0x26FF),
            (0x2700, 0x27BF), (0x1F1E6, 0x1F1FF),
          )
          def is_emoji(cp):
              return any(lo <= cp <= hi for lo, hi in emoji_ranges)
          text = ''.join('' if is_emoji(ord(c)) else c for c in text)
          text = text.replace('\uFE0F', '').replace('\uFE0E', '').replace('\u200D', '')
          # Body font (lmroman10) lacks these glyphs — substitute ASCII fallbacks for PDF
          text = text.replace('\u2194', ' <-> ').replace('\u2260', ' != ')

          open(p, 'w', encoding='utf-8').write(text)
          print(f'[preprocess] {len(text)} chars after cleanup')
          PY

      - name: Build PDF via Pandoc + XeLaTeX (zh-TW)
        if: matrix.lang == 'zh-TW'
        run: |
          set -eo pipefail
          pandoc whitepaper-zh-TW.md \
            --pdf-engine=xelatex \
            --verbose \
            --metadata-file=assets/pdf/metadata-zh-TW.yaml \
            --toc --toc-depth=3 \
            --highlight-style=tango \
            -V documentclass=report \
            -V CJKmainfont="Noto Serif CJK TC" \
            -V CJKsansfont="Noto Sans CJK TC" \
            -V CJKmonofont="Noto Sans CJK TC" \
            -V geometry:a4paper \
            -V geometry:margin=2.5cm \
            -V colorlinks=true \
            -V linkcolor=teal \
            -V urlcolor=blue \
            -V toccolor=black \
            -V lang=zh-Hant-TW \
            -o whitepaper-zh-TW.pdf 2>&1 | tee build.log
          ls -la whitepaper-zh-TW.pdf

      - name: Build PDF via Pandoc + XeLaTeX (en)
        if: matrix.lang == 'en'
        run: |
          set -eo pipefail
          pandoc whitepaper-en.md \
            --pdf-engine=xelatex \
            --verbose \
            --metadata-file=assets/pdf/metadata-en.yaml \
            --toc --toc-depth=3 \
            --highlight-style=tango \
            -V documentclass=report \
            -V CJKmainfont="Noto Serif CJK TC" \
            -V CJKsansfont="Noto Sans CJK TC" \
            -V CJKmonofont="Noto Sans CJK TC" \
            -V geometry:a4paper \
            -V geometry:margin=2.5cm \
            -V colorlinks=true \
            -V linkcolor=teal \
            -V urlcolor=blue \
            -V toccolor=black \
            -V lang=en \
            -o whitepaper-en.pdf 2>&1 | tee build.log
          ls -la whitepaper-en.pdf

      - name: Surface pandoc error as annotation + step summary (always)
        if: always()
        run: |
          if [ -f build.log ]; then
            err=$(grep -m1 -E '^! |Error:' build.log || true)
            if [ -n "$err" ]; then
              echo "::error title=PDF build (${{ matrix.lang }}) failed::$err"
            fi
            echo "### Pandoc log (${{ matrix.lang }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -c 20000 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: whitepaper-${{ matrix.lang }}
          path: |
            whitepaper-${{ matrix.lang }}.pdf
            whitepaper-${{ matrix.lang }}.md
            build.log
          if-no-files-found: warn
          retention-days: 90

      - name: Attach PDF to release
        # On a release event, attach to the release that triggered the build
        # (e.g. v0.2.3) — NOT a hardcoded tag. On master push, keep refreshing
        # the rolling v0.1-draft pre-release as the always-latest draft asset.
        if: (github.event_name == 'release' || github.ref == 'refs/heads/master') && success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || 'v0.1-draft' }}
          files: whitepaper-${{ matrix.lang }}.pdf
          fail_on_unmatched_files: true

  # ── Zenodo 存放(release 時才跑)───────────────────────────────────────
  # 獨立於 build matrix:matrix 每個語系跑一次,若把存放塞進去會建出多個
  # Zenodo 版本。這個 job 等所有語系都建完,只做一次存放。
  #
  # ⚠ 前提:GitHub↔Zenodo webhook 必須關閉(Zenodo → Applications → GitHub)。
  # 兩者並存會讓每次發版產生兩筆記錄(webhook 的 ZIP-only + 本 job 的 PDF 版),
  # 且 webhook 若較晚完成,concept DOI 會指向沒有 PDF 的那筆 —— 等於白做。
  zenodo:
    name: Deposit PDFs to Zenodo
    needs: build
    # release 事件自動存放;workflow_dispatch 帶 deposit_tag 可對「已發佈但存放失敗」的 release 重跑
    # (2026-08-30 v0.5.0:PDF 已掛上 release,Zenodo newversion 卻 403 —— 不必為了重存放再發一版)。
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deposit_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download built PDFs (release event)
        if: github.event_name == 'release'
        uses: actions/download-artifact@v7
        with:
          pattern: whitepaper-*
          merge-multiple: true

      - name: Download PDFs from the named release (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          gh release download "${{ github.event.inputs.deposit_tag }}" -R "${{ github.repository }}" -p 'whitepaper-*.pdf' --clobber
          ls -la whitepaper-*.pdf

      - name: Diagnose Zenodo (read-only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.diagnose == 'true'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_CONCEPT: ${{ vars.ZENODO_CONCEPT }}
        run: python3 assets/pdf/zenodo_deposit.py --diagnose --version probe

      - name: Deposit to Zenodo
        if: github.event_name == 'release' || github.event.inputs.diagnose != 'true'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_CONCEPT: ${{ vars.ZENODO_CONCEPT }}
        run: |
          set -eo pipefail
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "FATAL: 缺 secrets.ZENODO_TOKEN" >&2; exit 1
          fi
          if [ -z "$ZENODO_CONCEPT" ]; then
            echo "FATAL: 缺 vars.ZENODO_CONCEPT(concept record id,非 DOI 字串)" >&2; exit 1
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            VER="${{ github.event.release.tag_name }}"
          else
            VER="${{ github.event.inputs.deposit_tag }}"
          fi
          VER="${VER#v}"
          ls -la whitepaper-*.pdf
          python3 assets/pdf/zenodo_deposit.py --version "$VER" --files whitepaper-*.pdf
